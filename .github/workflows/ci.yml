name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (core coverage ≥ 90%)
        run: pnpm test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core
          path: packages/core/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Database integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integration tests (Testcontainers, PostgreSQL 18, RLS)
        run: pnpm test:int

  e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fieldops
          POSTGRES_PASSWORD: fieldops
          POSTGRES_DB: fieldops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fieldops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: "true"
      MIGRATION_DATABASE_URL: postgres://fieldops:fieldops@127.0.0.1:5432/fieldops
      APP_DB_PASSWORD: app-ci-password
      DATABASE_URL: postgres://fieldops_app:app-ci-password@127.0.0.1:5432/fieldops
      DEMO_MODE: "true"
      DEMO_PASSWORD: demo-ci-password
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      APP_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      APP_VERSION: ci
      APP_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter @fieldops/web build
      - name: Prepare standalone server
        working-directory: apps/web
        run: |
          cp -r .next/static .next/standalone/apps/web/.next/static
          cp -r public .next/standalone/apps/web/public
      - name: Migrate and seed the demo data
        run: |
          pnpm db:migrate
          pnpm db:seed
      - name: Install Playwright Chromium
        run: pnpm --filter @fieldops/web exec playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
