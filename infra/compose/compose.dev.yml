# Local development services: PostgreSQL and Mailpit (catches every email at http://localhost:8025).
#   docker compose -f infra/compose/compose.dev.yml up -d
name: fieldops-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: fieldops
      POSTGRES_DB: fieldops
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldops"]
      interval: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

volumes:
  pgdata:
