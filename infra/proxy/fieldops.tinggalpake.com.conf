# fieldops.tinggalpake.com: FieldOps Web (web app, portal, /api/v1, API docs).
# The web container listens only on 127.0.0.1:8097. Install:
#   cp infra/proxy/fieldops.tinggalpake.com.conf /etc/nginx/sites-available/fieldops.tinggalpake.com
#   ln -s ../sites-available/fieldops.tinggalpake.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d fieldops.tinggalpake.com
server {
    server_name fieldops.tinggalpake.com;

    access_log /var/log/nginx/fieldops.tinggalpake.access.log;
    error_log  /var/log/nginx/fieldops.tinggalpake.error.log;

    server_tokens off;

    # Real visitor IP: trust CF-Connecting-IP only from Cloudflare ranges (https://www.cloudflare.com/ips/).
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Attachments go straight to object storage; this only covers form posts and API bodies.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Server-sent events: no buffering, long read timeout (heartbeat every 30 s).
    location ~ ^/api/v1/stream {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fieldops.tinggalpake.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fieldops.tinggalpake.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = fieldops.tinggalpake.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name fieldops.tinggalpake.com;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}